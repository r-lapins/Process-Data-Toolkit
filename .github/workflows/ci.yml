name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: Build & test (GCC)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ libgtest-dev

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug --output-on-failure

  build-test-clang-sanitizers:
    name: Build & test (Clang + sanitizers)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang libgtest-dev

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug --output-on-failure

  clang-tidy:
    name: Clang-Tidy
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang clang-tidy libgtest-dev

      - name: Configure
        run: |
          cmake --preset debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_CLANG_TIDY=clang-tidy

      - name: Build
        run: cmake --build --preset debug

  build-cuda:
    name: Build (RTL-SDR + CUDA, compile-only)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ libgtest-dev pkg-config librtlsdr-dev

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.4.1'

      - name: Configure
        run: cmake --preset debug-rtlsdr-cuda-nosan

      - name: Build
        run: cmake --build --preset debug-rtlsdr-cuda-nosan
